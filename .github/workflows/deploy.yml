name: Deploy VākyaSetu to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Continuous Deployment via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment on $(hostname)..."
            
            # Ensure Docker and Docker Compose are installed
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed on this server. Please install Docker first."
              exit 1
            fi

            # Clone repository if it does not exist, otherwise pull latest
            if [ ! -d "$HOME/Vakyasetu" ]; then
              echo "📥 Cloning repository for the first time..."
              git clone https://github.com/SHRINIVAS-BHONG/Vakyasetu.git "$HOME/Vakyasetu"
            fi

            cd "$HOME/Vakyasetu"
            
            echo "🔄 Pulling latest commits from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Building and starting containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "✅ Deployment complete! Active containers:"
            docker compose ps
